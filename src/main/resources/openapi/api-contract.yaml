openapi: 3.0.3
info:
  title: Notification Platform API
  version: 1.0.0
  description: |
    Multi-channel (SMS, EMAIL, PUSH) notification platform used by internal product teams.

    Design rules baked into this contract:
    - `202 Accepted` means durably accepted (written to the intake log), NOT delivered.
    - Priority is owned by the template registry, never by the caller.
    - Every create call requires an `Idempotency-Key`.
    - Marketing traffic goes through `/campaigns` only, and is restricted to marketing-class templates.
    - Provider receipts arrive on a separate, signed, provider-facing endpoint.
servers:
  - url: https://notifications.example.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Notifications
    description: Single transactional / informational sends (P0-P2).
  - name: Campaigns
    description: Bulk marketing sends (P3) with scheduling and throttling.
  - name: Webhooks
    description: Client callback registration for status events.
  - name: Provider Receipts
    description: Inbound delivery receipts from external SMS, email and push providers.

paths:
  /api/v1/notifications:
    post:
      tags: [Notifications]
      operationId: createNotification
      summary: Submit a single notification
      description: |
        Validates synchronously (auth, schema, template exists, required variables present,
        recipient contact present for every requested channel), writes to the durable intake
        log, and returns 202. Opt-out checks, routing and sending happen asynchronously.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
            example:
              templateId: LOGIN_OTP
              recipient:
                customerId: C123
                phoneNumber: '+919876543210'
                emailAddress: abc@example.com
              delivery:
                channels: [SMS, EMAIL]
                strategy: FALLBACK
                fallbackAfterSeconds: 15
                ttlSeconds: 60
              variables:
                otp: '483921'
                expiryMinutes: '1'
              locale: en-IN
              correlationId: login-flow-8841
      responses:
        '202':
          description: Accepted (or replay of an earlier request with the same Idempotency-Key).
          headers:
            Idempotent-Replayed:
              description: Present and `true` when this response is a replay of an earlier request.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/notifications/{notificationId}:
    get:
      tags: [Notifications]
      operationId: getNotification
      summary: Get notification status and delivery attempts
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Current status with the full attempt history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/campaigns:
    post:
      tags: [Campaigns]
      operationId: createCampaign
      summary: Create a marketing campaign
      description: |
        Creates one campaign that fans out to the referenced audience in a separate pipeline.
        The audience is referenced, never inlined. Only templates registered as marketing class
        are accepted. Consent and opt-outs are enforced at send time, not only at creation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
            example:
              name: Diwali offer 2026
              templateId: PROMO_DIWALI
              audience:
                segmentId: seg_active_90d
              delivery:
                channels: [SMS, EMAIL]
                strategy: PARALLEL
              schedule:
                startAt: '2026-11-08T04:30:00Z'
                endBy: '2026-11-09T18:30:00Z'
                timeMode: RECIPIENT_LOCAL
                quietHours:
                  start: '21:00'
                  end: '09:00'
              throttle:
                maxPerSecond: 2000
              variables:
                offerCode: DIWALI26
              locale: en-IN
      responses:
        '202':
          description: Campaign accepted and scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Campaigns]
      operationId: listCampaigns
      summary: List campaigns owned by the calling client
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/CampaignState'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of campaigns.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignStatus'
                  nextCursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/campaigns/{campaignId}:
    get:
      tags: [Campaigns]
      operationId: getCampaign
      summary: Get campaign state and aggregate counters
      description: Returns aggregate counters only. Per-message detail is not served at campaign scale.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign state with counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/campaigns/{campaignId}/pause:
    post:
      tags: [Campaigns]
      operationId: pauseCampaign
      summary: Pause a running or scheduled campaign
      description: Stops draining immediately. Already-handed-off messages are not recalled.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/v1/campaigns/{campaignId}/resume:
    post:
      tags: [Campaigns]
      operationId: resumeCampaign
      summary: Resume a paused campaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/v1/campaigns/{campaignId}/cancel:
    post:
      tags: [Campaigns]
      operationId: cancelCampaign
      summary: Cancel a campaign (terminal)
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/v1/webhook-subscriptions:
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Register a per-client callback URL for status events
      description: |
        Callbacks are registered once per client, never per request, so callers cannot point the
        platform at arbitrary URLs. Deliveries are signed with the returned secret and sent as
        `NotificationStatusEvent` payloads (at-least-once; consumers must dedupe on `eventId`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookSubscriptionRequest'
      responses:
        '201':
          description: Subscription created. The signing secret is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List the calling client's subscriptions
      responses:
        '200':
          description: Subscriptions (secrets are never returned here).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/webhook-subscriptions/{subscriptionId}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Delete a subscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/providers/{providerId}/receipts:
    post:
      tags: [Provider Receipts]
      operationId: receiveProviderReceipt
      summary: Inbound delivery receipt from an external channel provider
      description: |
        Called by SMS, email and push providers, not by product teams. Authenticated by
        signature, not by bearer token. The handler must only verify, enqueue and return
        quickly; processing is asynchronous. Receipts can arrive late, out of order, duplicated,
        or never (some carriers do not send them), so processing is idempotent on
        `(providerId, providerMessageId, status)`.
      security:
        - providerSignature: []
      parameters:
        - name: providerId
          in: path
          required: true
          description: Platform-assigned identifier of the provider integration.
          schema:
            type: string
        - name: X-Provider-Signature
          in: header
          required: true
          description: HMAC of the raw request body using the provider's shared secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderReceipt'
            example:
              providerMessageId: SM8f3a21c
              channel: SMS
              status: DELIVERED
              occurredAt: '2026-10-30T10:15:07Z'
      responses:
        '200':
          description: Receipt accepted for processing.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Signature missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Client token identifying the calling team. Scopes restrict which templates and priority
        classes the client may use, and carry its quota.
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: HMAC signature of the request body.

  parameters:
    IdempotencyKey:
      name: x-header-idempotency-key
      in: header
      required: true
      description: |
        Client-generated unique key (UUID recommended). Same key within 24 hours returns the
        original response without resending. Same key with a different payload returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        example: ntf_01JBX7Q2
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        example: cmp_01JBX9A4

  schemas:
    Channel:
      type: string
      enum: [SMS, EMAIL, PUSH]

    NotificationState:
      type: string
      description: |
        ACCEPTED: durably accepted. QUEUED: in a priority queue. SENT: handed to a provider.
        DELIVERED: provider reported delivery. FAILED: all channels and retries exhausted.
        SUPPRESSED: dropped by opt-out, DND or consent rules. EXPIRED: TTL passed before send.
      enum: [ACCEPTED, QUEUED, SENT, DELIVERED, FAILED, SUPPRESSED, EXPIRED]

    Recipient:
      type: object
      required: [customerId]
      properties:
        customerId:
          type: string
        phoneNumber:
          type: string
          description: E.164 format. Required when SMS is requested.
          example: '+919876543210'
        emailAddress:
          type: string
          format: email
          description: Required when EMAIL is requested.
        pushToken:
          type: string
          description: Required when PUSH is requested.

    Delivery:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Ordered list. Order is the fallback order when strategy is FALLBACK.
          items:
            $ref: '#/components/schemas/Channel'
        strategy:
          type: string
          enum: [PARALLEL, FALLBACK]
          default: FALLBACK
        fallbackAfterSeconds:
          type: integer
          minimum: 1
          maximum: 300
          description: Wait this long for a delivery receipt before moving to the next channel.
        ttlSeconds:
          type: integer
          minimum: 1
          description: Drop (EXPIRED) if not sent within this time. Defaults from the template.

    CreateNotificationRequest:
      type: object
      required: [templateId, recipient, delivery]
      properties:
        templateId:
          type: string
          description: |
            Registered template. Priority, allowed channels, sensitive variables and default TTL
            are defined by the template registry, not by the caller.
        recipient:
          $ref: '#/components/schemas/Recipient'
        delivery:
          $ref: '#/components/schemas/Delivery'
        variables:
          type: object
          additionalProperties:
            type: string
          description: |
            Validated against the template schema. Variables flagged sensitive (for example `otp`)
            are redacted in logs and not retained beyond the TTL.
        locale:
          type: string
          example: en-IN
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Optional future send time. Not allowed for P0 templates.
        correlationId:
          type: string
          description: Caller's trace identifier. Not used for deduplication.

    NotificationAccepted:
      type: object
      required: [notificationId, status, statusUrl]
      properties:
        notificationId:
          type: string
        status:
          type: string
          enum: [ACCEPTED]
        statusUrl:
          type: string

    Attempt:
      type: object
      required: [channel, outcome, at]
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        provider:
          type: string
          example: smsProviderA
        outcome:
          type: string
          enum: [SENT, DELIVERED, FAILED, TIMED_OUT, SKIPPED]
        errorCode:
          type: string
          nullable: true
        at:
          type: string
          format: date-time

    NotificationStatus:
      type: object
      required: [notificationId, status, attempts]
      properties:
        notificationId:
          type: string
        templateId:
          type: string
        correlationId:
          type: string
        status:
          $ref: '#/components/schemas/NotificationState'
        acceptedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'

    CampaignState:
      type: string
      enum: [SCHEDULED, RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED]

    Audience:
      type: object
      description: A reference to the audience, never an inline recipient list.
      oneOf:
        - type: object
          required: [segmentId]
          properties:
            segmentId:
              type: string
        - type: object
          required: [audienceFileRef]
          properties:
            audienceFileRef:
              type: string
              description: Reference to a pre-uploaded, validated audience file.

    Schedule:
      type: object
      required: [startAt]
      properties:
        startAt:
          type: string
          format: date-time
        endBy:
          type: string
          format: date-time
          description: Messages not sent by this time are dropped, not sent late.
        timeMode:
          type: string
          enum: [ABSOLUTE, RECIPIENT_LOCAL]
          default: ABSOLUTE
        quietHours:
          type: object
          properties:
            start:
              type: string
              example: '21:00'
            end:
              type: string
              example: '09:00'

    Throttle:
      type: object
      required: [maxPerSecond]
      properties:
        maxPerSecond:
          type: integer
          minimum: 1
          description: Upper bound on drain rate. The platform may apply a lower effective rate.

    CreateCampaignRequest:
      type: object
      required: [name, templateId, audience, delivery, schedule]
      properties:
        name:
          type: string
        templateId:
          type: string
          description: Must be a marketing-class template.
        audience:
          $ref: '#/components/schemas/Audience'
        delivery:
          $ref: '#/components/schemas/Delivery'
        schedule:
          $ref: '#/components/schemas/Schedule'
        throttle:
          $ref: '#/components/schemas/Throttle'
        variables:
          type: object
          additionalProperties:
            type: string
          description: Campaign-wide variables. Per-recipient values come from the audience source.
        locale:
          type: string

    CampaignAccepted:
      type: object
      required: [campaignId, state, statusUrl]
      properties:
        campaignId:
          type: string
        state:
          type: string
          enum: [SCHEDULED]
        statusUrl:
          type: string

    CampaignCounters:
      type: object
      properties:
        audienceSize:
          type: integer
          format: int64
        queued:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        delivered:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        suppressed:
          type: integer
          format: int64
        expired:
          type: integer
          format: int64

    CampaignStatus:
      type: object
      required: [campaignId, state]
      properties:
        campaignId:
          type: string
        name:
          type: string
        state:
          $ref: '#/components/schemas/CampaignState'
        startedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        counters:
          $ref: '#/components/schemas/CampaignCounters'

    CreateWebhookSubscriptionRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS endpoint owned by the client.
        events:
          type: array
          items:
            type: string
            enum: [notification.sent, notification.delivered, notification.failed, notification.suppressed, notification.expired, campaign.completed]

    WebhookSubscription:
      type: object
      required: [subscriptionId, url, events]
      properties:
        subscriptionId:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        signingSecret:
          type: string
          description: Returned only on creation.

    NotificationStatusEvent:
      type: object
      description: Payload delivered to client webhooks (at-least-once). Dedupe on eventId.
      required: [eventId, type, notificationId, occurredAt]
      properties:
        eventId:
          type: string
        type:
          type: string
        notificationId:
          type: string
        correlationId:
          type: string
        status:
          $ref: '#/components/schemas/NotificationState'
        occurredAt:
          type: string
          format: date-time

    ProviderReceipt:
      type: object
      required: [providerMessageId, channel, status, occurredAt]
      properties:
        providerMessageId:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        status:
          type: string
          enum: [DELIVERED, FAILED, UNDELIVERED, BOUNCED, COMPLAINED]
        errorCode:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Invalid payload, unknown template, missing variable or missing recipient contact.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Client is not allowed to use this template or priority class.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: Idempotency-Key was already used with a different payload.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidState:
      description: The campaign is not in a state that allows this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Client quota exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Intake is temporarily unavailable. Safe to retry with the same Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
